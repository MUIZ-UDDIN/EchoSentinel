services:
      backend:
        build: .
        command: uvicorn main:app --host 0.0.0.0 --port 8000
        ports: 
          - "8000:8000"
        env_file:
          - .env
        volumes:
          - db-data:/app/database

      whitcher_app:
        build: .
        command: python BackEnd/whitcher.py
        env_file:
          - .env
        volumes:
          - db-data:/app/database

volumes:
  db-data: