<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Intelligence Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
<base target="_blank">
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Analyzing market sentiment...</div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Market Intelligence Dashboard</h1>
            <p>Real-time sentiment analysis from financial news & articles</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="Search articles by keywords (e.g., 'tech stocks', 'inflation', 'crypto')...">
                <button class="btn btn-search" id="Search_btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </svg>
                    Search
                </button>
                <button class="btn btn-history" id="History_btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"></path>
                        <path d="M3 3v9h9"></path>
                    </svg>
                    Fetch History
                </button>
            </div>
        </div>

        <div class="sentiment-section">
            <div class="sentiment-card">
                <div class="sentiment-label">Market Sentiment</div>
                <div class="sentiment-value neutral" id="sentimentValue">
                    <span class="sentiment-icon">⚖️</span>
                    <span id="sentimentText"></span>
                </div>
                <div class="sentiment-subtext" id="sentimentSubtext"></div>
            </div>
        </div>

        <div class="articles-section">
            <div class="section-header">
                <h2 class="section-title">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #60a5fa;">
                        <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
                        <path d="M18 14h-8"></path>
                        <path d="M15 18h-5"></path>
                        <path d="M10 6h8v4h-8V6Z"></path>
                    </svg>
                    Filtered Articles
                </h2>
                <span class="article-count" id="articleCount">0 articles</span>
            </div>
            <div class="articles-grid" id="articlesGrid">
                <div class="empty-state" id="history_data" style="grid-column: 1 / -1;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
